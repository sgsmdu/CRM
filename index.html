    <script>
      // Suppress Vite dev server HMR WebSocket disconnection errors in iframe preview
      (function() {
        var originalConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var isViteWsError = args.some(function(arg) {
            if (!arg) return false;
            var str = typeof arg === 'string' ? arg : (arg.message || String(arg));
            return str.indexOf('WebSocket') !== -1 || str.indexOf('[vite]') !== -1;
          });
          if (isViteWsError) {
            return;
          }
          return originalConsoleError.apply(console, arguments);
        };

        window.addEventListener('error', function(event) {
          if (
            event.message && (
              event.message.indexOf('WebSocket') !== -1 ||
              event.message.indexOf('WebSocket closed without opened') !== -1 ||
              event.message.indexOf('[vite]') !== -1
            )
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          if (
            reason && (
              (typeof reason === 'string' && (reason.indexOf('WebSocket') !== -1 || reason.indexOf('vite') !== -1)) ||
              (reason.message && (reason.message.indexOf('WebSocket') !== -1 || reason.message.indexOf('vite') !== -1))
            )
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
