    <script>
      // Shim WebSocket for Vite HMR to eliminate "WebSocket closed without opened" in AI Studio preview
      (function() {
        if (typeof window !== 'undefined' && window.WebSocket) {
          var RealWebSocket = window.WebSocket;
          function ViteSafeWebSocket(url, protocols) {
            var urlStr = String(url || '');
            var isViteHmr = urlStr.indexOf('vite') !== -1 || 
                            protocols === 'vite-hmr' || 
                            (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1);
            if (isViteHmr) {
              var listeners = {};
              var fakeWs = {
                readyState: 1, // OPEN
                OPEN: 1,
                CLOSED: 3,
                CONNECTING: 0,
                CLOSING: 2,
                addEventListener: function(event, fn) {
                  listeners[event] = listeners[event] || [];
                  listeners[event].push(fn);
                  if (event === 'open') {
                    setTimeout(function() {
                      try { fn({ type: 'open' }); } catch(e) {}
                    }, 0);
                  }
                },
                removeEventListener: function(event, fn) {
                  if (listeners[event]) {
                    listeners[event] = listeners[event].filter(function(cb) { return cb !== fn; });
                  }
                },
                send: function() {},
                close: function() {
                  fakeWs.readyState = 3;
                }
              };
              return fakeWs;
            }
            return new RealWebSocket(url, protocols);
          }
          ViteSafeWebSocket.prototype = RealWebSocket.prototype;
          ViteSafeWebSocket.OPEN = 1;
          ViteSafeWebSocket.CLOSED = 3;
          ViteSafeWebSocket.CONNECTING = 0;
          ViteSafeWebSocket.CLOSING = 2;
          window.WebSocket = ViteSafeWebSocket;
        }

        var originalConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var isViteWsError = args.some(function(arg) {
            if (!arg) return false;
            var str = typeof arg === 'string' ? arg : (arg.message || String(arg));
            return str.indexOf('WebSocket') !== -1 || str.indexOf('[vite]') !== -1;
          });
          if (isViteWsError) {
            return;
          }
          return originalConsoleError.apply(console, arguments);
        };

        window.addEventListener('error', function(event) {
          var msg = (event.message || '') + ' ' + (event.error ? (event.error.message || '') + ' ' + (event.error.stack || '') : '');
          if (
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('WebSocket closed without opened') !== -1 ||
            msg.indexOf('[vite]') !== -1
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          var msg = (typeof reason === 'string' ? reason : (reason ? (reason.message || '') + ' ' + (reason.stack || '') : ''));
          if (
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('vite') !== -1 ||
            msg.indexOf('[vite]') !== -1
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
